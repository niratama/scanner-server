# /etc/scanbd/scanner.d/canon_dr.conf に配置するサンプル設定
device canon_dr {
    filter = "^canon_dr.*"
    desc = "Canon DR-C125"

    action start {
        filter = "^start$"
        numerical-trigger {
            from-value = 0
            to-value   = 1
        }
        desc   = "Start button scan"
        script = "/home/<your-user>/scanner-app/scripts/button_trigger.sh"
    }
}
