# /etc/scanbd/scanner.d/canon_dr.conf に配置するサンプル設定
# 事前に scripts/button_trigger.sh を /etc/scanbd/scripts/button_trigger.sh (chmod 755) へ配置してください
device canon_dr {
    filter = "^canon_dr.*"
    desc = "Canon DR-C125"

    action start {
        filter = "^start$"
        numerical-trigger {
            from-value = 0
            to-value   = 1
        }
        desc   = "Start button scan"
        script = "/etc/scanbd/scripts/button_trigger.sh"
    }
}
